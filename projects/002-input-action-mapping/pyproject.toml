[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-actions"
version = "1.0.0"
description = "Breakout with a rebindable keyboard/gamepad input action layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
breakout-actions = "breakout.platform.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
