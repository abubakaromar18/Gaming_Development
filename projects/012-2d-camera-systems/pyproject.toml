[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera2d"
version = "1.0.0"
description = "2D camera systems demo: follow, deadzone, look-ahead, bounds, and trauma-based screen shake"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
camera2d = "camera2d.platform.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
